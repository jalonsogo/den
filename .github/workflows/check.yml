name: Check

# Separate from build.yml on purpose: that one runs on `v*` tags and produces
# signed installers, which is far too heavy for every push. This is the cheap
# gate — types and unit tests — and it is the one that should block a merge.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips electron-builder's native rebuild (node-pty),
      # which needs a real desktop toolchain and isn't required to type-check or
      # to run the pure-function tests.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
